[project]
name = "mri"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "dcm2niix>=1.0.20260416",
    "ipykernel>=7.3.0",
    "ipywidgets>=8.1.8",
    "jupyter>=1.1.1",
    "matplotlib>=3.11.0",
    "nibabel>=5.4.2",
    "nilearn>=0.13.1",
    "pandas>=3.0.3",
    "plotly>=6.8.0",
    "pydicom>=3.0.2",
    "scikit-image>=0.26.0",
    "simpleitk>=2.4.0",
    "pyvista>=0.44",
    "trimesh>=4.4",
    "hd-bet>=2.0.0",
    "pymeshfix>=0.17",
]

[dependency-groups]
dev = [
    "ruff>=0.9.0",
]

[project.scripts]
mri = "main:main"
convert = "main:run_conversion"
brain = "main:run_brain_extraction"
3way = "main:run_3way_viewer"


[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
include = ["main.py", "convert.py", "mri_utils.py", "extract.py", "mri.py" , "BrainBuilder.py"]

[tool.ruff]
line-length = 88
target-version = "py314"

extend-exclude = ["old", "output", "bin", "niix", ".venv"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
docstring-code-format = true
docstring-code-line-length = "dynamic"


[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]