[project]
name = "cwoehrle.brain"
version = "1.0.2"
description = "MRI processing and 3D brain mesh visualization from DICOM/NIfTI scans"
readme = "README.md"
requires-python = ">=3.14"
authors = [{ name = "Calvin Woehrle", email = "code@calvinwoehrle.com" }]
license = "LicenseRef-Proprietary"
classifiers = [
    "Private :: Do Not Upload",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "dcm2niix>=1.0.20260416",
    "nibabel>=5.4.2",
    "nilearn>=0.13.1",
    "plotly>=6.8.0",
    "scipy>=1.16.0",
    "simpleitk>=2.4.0",
    "pyvista>=0.44",
    "trimesh>=4.4",
    "hd-bet>=2.0.0",
    "pymeshfix>=0.17",
]

[dependency-groups]
dev = [
    "ruff>=0.9.0",
    "ty>=0.0.56",
    "ipykernel>=7.3.0",
    "ipywidgets>=8.1.8",
    "jupyter>=1.1.1",
    "matplotlib>=3.11.0",
    "pandas>=3.0.3",
    "pydicom>=3.0.2",
    "scikit-image>=0.26.0",
]

[project.scripts]
mri = "cwoehrle.brain.main:main"
convert = "cwoehrle.brain.main:run_conversion"
brain = "cwoehrle.brain.main:run_brain_extraction"
3way = "cwoehrle.brain.main:run_3way_viewer"

[project.urls]
Homepage = "https://github.com/cwoehrle/brain"
Repository = "https://github.com/cwoehrle/brian"


[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cwoehrle"]

[tool.ruff]
line-length = 88
target-version = "py314"

extend-exclude = ["old", "output", "bin", "niix", ".venv"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
docstring-code-format = true
docstring-code-line-length = "dynamic"

[tool.ty.src]
exclude = ["old"]


[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]
